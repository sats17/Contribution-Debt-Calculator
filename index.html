<!DOCTYPE html>
<html>

<head>
    <title>Contribution Debt Calculator</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="assistance.js"></script>
    <script src="dynamic_tables.js"></script>

    <style>
        body {
            margin: 0;
            font-family: system-ui, Arial, sans-serif;
            background: #f6f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            max-width: 360px;
            margin: 0 auto;
        }

        input[type="number"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #4a90e2;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #4a90e2;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3b78c2;
        }

        #noteId {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background: #fafafa;
            font-weight: 600;
        }

        td[contenteditable="true"], th[contenteditable="true"] {
            background: #fffef6;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }

        .footer a {
            color: #4a90e2;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Contribution Debt Calculator</h1>
    <p>Simple way to split shared expenses</p>

    <div class="card">
        <div class="input-grid">
            <input type="number" id="contributors" min="2" max="20"
                   placeholder="Number of contributors">

            <input type="number" id="merchants" min="1" max="20"
                   placeholder="Number of merchants">

            <button onclick="generateTable()">Generate Table</button>
        </div>

        <div id="noteId"></div>
    </div>

    <div id="tablesId"></div>

    <div class="footer">
        <p>
            We do not store any data. Fully client-side calculator. <br>
            <a href="https://www.github.com/sats17/Contribution-Debt-Calculator">Source Code</a>
        </p>
    </div>

</div>

</body>
</html>
